[package]
name = "finance-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
rust_widgets = { path = "../..", features = ["runtime-fonts"] }
# The finance controls live in the suite package (4.0.0): they are domain-specific, so the
# parent crate no longer carries them. The `finance` feature selects this group.
rust-widgets-suites = { path = "../../crates/rust-widgets-suites", features = ["finance"] }
preview-common = { path = "../preview_common" }
