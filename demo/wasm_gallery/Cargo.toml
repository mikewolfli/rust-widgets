[package]
name = "wasm-gallery-demo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# `cdylib` is what wasm-bindgen packages; `rlib` keeps `main.rs` and the host
# `cargo check` able to link the same `app` module.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The browser feature set the cookbook names for a wasm web app: `mobile` is the
# device profile (it brings `touch`, the vector text faces and the full widget
# set), `wasm` selects the browser backend.
#
# BLUE31 turned the two editor controls and their lexer into independent features, so a
# profile-only build no longer carries them. The gallery enumerates the registry and must
# keep showing every card it showed before, so it asks for them explicitly.
rust_widgets = { path = "../..", default-features = false, features = [
    "mobile",
    "wasm",
    "code-editor",
    "markdown-editor",
    "builtin-languages",
] }

# Browser-only: the demo owns the paint loop, so it needs the 2D context and
# `ImageData` the library's own backend does not use. Declared per target so a
# host `cargo check` of this crate compiles no browser glue at all.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "Window",
    "console",
] }
