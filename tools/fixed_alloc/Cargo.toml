[package]
name = "fixed_alloc"
version = "0.1.0"
edition = "2021"
publish = false

# A throwaway probe that decides how a `gtk::Fixed` child should be sized, by
# measuring both options against the two defects a child size request causes: a
# window that cannot shrink, and a layout negotiation per control per frame.
# It depends on nothing from the crate, so the tree it builds is explicit.

[[bin]]
name = "fixed_alloc"
path = "src/main.rs"

[dependencies]
gtk = "0.18"
