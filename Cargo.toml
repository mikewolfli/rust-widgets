[package]
name = "rust_widgets"
version = "0.8.1"
edition = "2021"
description = "Cross-platform native GUI library"
license = "MIT"

[lints.rust]
unexpected_cfgs = "allow"

[lib]
crate-type = ["lib", "cdylib"]

[features]
# ── Device-class profiles (pick ONE; `desktop` is the default) ──
default = ["desktop"]
## Full desktop PC: native platform, i18n, theme, bindings, touch, GPU.
desktop = ["desktop-runtime", "gpu-wgpu", "quality-management", "controls-native", "controls-custom", "advanced-widgets", "print", "pdf", "chart"]
## Tablet: touch-enabled, GPU-accelerated, native + custom controls.
tablet = ["touch", "gpu-wgpu", "quality-management", "controls-native", "controls-custom"]
## Mobile phone: touch-enabled, GPU-accelerated, mobile API bindings, native + custom controls.
mobile = ["touch", "gpu-wgpu", "quality-management", "mobile-api", "controls-native", "controls-custom"]
## Embedded/stripped: no touch, no i18n, software-only render.
embedded = []

# ── Interaction features (composable atop device profiles) ──
## Touch events + gesture recognizer engine.
touch = []
## Laser holographic keyboard/screen (Z-axis depth events).
holographic = []
## Projection/remote-control (air gestures, pointer input).
projection = []

# ── Runtime / platform backend features ──
desktop-runtime = []
gpu-wgpu = ["wgpu"]
quality-management = []
mobile-api = []
gtk-native = ["dep:gtk"]
wayland-native = []
controls-native = []
objc2-macos = ["dep:objc2-foundation"]
controls-custom = []

# ── Optional content modules ──
print = []
pdf = []
chart = []
advanced-widgets = []

# ── Unstable / experimental features ──
unstable-pipeline-routing = []
unstable-special-widgets = []

# ── Meta-feature: everything that can coexist ──
# NOTE: device-class features (desktop/tablet/mobile/embedded) are
# mutually exclusive and NOT combined here. Pick one device profile
# and compose with interaction add-ons as needed.
full = ["desktop", "touch", "holographic", "projection", "wayland-native", "gtk-native", "objc2-macos", "unstable-pipeline-routing", "unstable-special-widgets"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
threadpool = "1.8"
crossbeam-channel = "0.5"
font8x8 = "0.2.7"
pollster = "0.3"
chrono = "0.4"
notify = "6.1"
dirs = "5.0"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "commctrl", "winbase", "synchapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
objc2-foundation = { version = "0.3", optional = true }
cocoa = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["staging"], optional = true }
wayland-cursor = { version = "0.31", optional = true }

[target.'cfg(target_os = "harmony")'.dependencies]
# dependency for Huawei HarmonyOS, if applicable. Placeholder for now since HarmonyOS support is in early stages and may require custom bindings or FFI.

[dependencies.wgpu]
version = "0.16"
optional = true

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.8"
