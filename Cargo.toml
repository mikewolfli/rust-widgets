[package]
name = "rust_widgets"
version = "0.6.1"
edition = "2021"
description = "Cross-platform native GUI library"
license = "MIT"

[lints.rust]
unexpected_cfgs = "allow"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["full"]
full = ["print", "pdf", "chart", "desktop-runtime", "gpu-wgpu", "quality-management", "mobile-api", "controls-native", "controls-custom", "advanced-widgets"]
advanced-widgets = []
embedded = []
print = []
pdf = []
chart = []
desktop-runtime = []
gpu-wgpu = ["wgpu"]
quality-management = []
mobile-api = []
gtk-native = ["dep:gtk"]
controls-native = []
controls-custom = []
objc2-macos = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
threadpool = "1.8"
crossbeam-channel = "0.5"
winit = "0.30.13"
font8x8 = "0.2.7"
pollster = "0.3"
roxmltree = "0.19"
chrono = "0.4"
notify = "8.2"
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "commctrl", "winbase", "synchapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
objc2-foundation = { version = "0.3", optional = true }
cocoa = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "harmony")'.dependencies]
# dependency for Huawei HarmonyOS, if applicable. Placeholder for now since HarmonyOS support is in early stages and may require custom bindings or FFI.

[dependencies.wgpu]
version = "0.16"
optional = true



[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.8"
