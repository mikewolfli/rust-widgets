[package]
name = "rust_widgets"
version = "2.8.2"
edition = "2021"
description = "Pure Rust cross-platform native GUI library with hardware-adaptive rendering, 180 widgets, touch/gesture support, i18n, and SVG-pipeline-accurate output"
license = "MIT"
keywords = ["gui", "widget", "cross-platform", "mobile", "wasm"]
categories = ["gui", "rendering", "graphics", "embedded", "wasm"]
authors = ["Mike Li <mikewolfli@163.com>"]
readme = "README.md"
homepage = "https://github.com/mikewolfli/rust-widgets"
repository = "https://github.com/mikewolfli/rust-widgets"
rust-version = "1.87"
include = [
    "build.rs",
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "examples/**/*",
    "include/**/*",
    "language/**/*",
    # Both files under `tools/` are *declared* as Cargo targets below, so they must
    # ship: a target whose path is absent from the package makes `cargo package`
    # warn `ignoring test \`view_platform_gate_probe\` as
    # `tools/view_platform_gate_probe.rs` is not included in the published package`,
    # and a consumer building from the tarball then has no such target at all.
    # The rest of `tools/` is gates and generators that are not part of the crate's
    # build surface and stays excluded.
    "tools/widget_gallery.rs",
    "tools/view_platform_gate_probe.rs",
    # The designer's generation entry point (D7-b-3). Declared as an example below, so
    # it must ship for the same reason: without it, a consumer who takes the crate from
    # the tarball has the `designer` feature and the `designer_generate` binary it
    # documents, but not the target that writes a project's committed sources.
    "tools/designer_generate.rs",
    "LICENSE",
    "NOTICE",
    "README.md",
    "README.zh-CN.md",
    "CHANGELOG.md",
    "clippy.toml",
    "rustfmt.toml",
]

[lints.rust]
# `target_os = "ohos"` (HarmonyOS NEXT) is not yet in rustc's built-in
# known target_os list; declare it explicitly so the check stays meaningful.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("ohos"))',
    'cfg(feature, values("cargo-clippy"))',
] }

[lib]
crate-type = ["lib", "cdylib"]

# ═══════════════════════════════════════════════════════════════════════
# Feature System — three independent axes (pick one from each):
#   1. Device Profile (pick ONE)
#   2. OS Backend    (pick ONE or auto)
#   3. Capability    (arbitrary composition)
# ═══════════════════════════════════════════════════════════════════════

[features]
# ── Default is full desktop ──
#
# `default` names the `desktop` profile and nothing else. The real font and icon payloads now live
# **in the device profiles** (`desktop`/`tablet`/`mobile`) rather than in `default`:
#
#   * a profile answers "what kind of machine is this", and a desktop/tablet/mobile host is one
#     that has the bytes to spare and *wants* antialiased text and real icon outlines;
#   * `mini`/`embedded` are *sized*, so they still carry neither — a payload the caller did not ask
#     for is exactly wrong there.
#
# Carrying the data in the profiles (rather than in `default`) is what makes a plain
# `--no-default-features --features desktop` build — the one this crate's own gates export and test
# — render the same text and icons a plain `cargo build` does. Before this, the two disagreed: the
# snapshots were produced by `--features desktop`, which carried no fonts, so every glyph fell back
# to the 8x8 bitmap while the runtime (a `default` build) drew real outlines.
#
# `tools/check_icon_data_is_opt_in.sh` and `tools/check_font_data_is_opt_in.sh` assert both halves
# of the new split: the data is present in `desktop`/`tablet`/`mobile`, absent from
# `default`/`mini`/`embedded`.
default = ["desktop"]

# ── Axis 1: DEVICE PROFILES (mutually exclusive) ──

## Full desktop: native platform, GPU, touch, i18n, chart, print, PDF, A11y.
##
## NOTE: `audio-output`, `symphonia-codecs`, and `video-codecs`
## are NOT enabled by default because they pull in large system-library
## dependencies (ALSA, FFmpeg, symphonia). Enable them explicitly:
##   cargo build --features "desktop,audio-output,symphonia-codecs,video-codecs"
## Or use the `full` meta-feature for everything.
##
## `webkit-engine` used to be listed here. It was removed in BLUE20 layer 5 (ruling W1,
## 2026-09-21) together with the 76-line WebKitGTK wrapper it gated: the wrapper never
## displayed a page, so the feature advertised a capability the library did not have.
desktop = [
    "os-auto",
    "cocoa-legacy",
    "desktop-runtime",
    "wgpu",
    "touch",
    "i18n",
    "chart",
    "print",
    "pdf",
    "a11y",
    "quality-management",
    "advanced-widgets",
    "controls-native",
    "controls-custom",
    "image",
    "video",
    "audio",
    "pdf-encryption",
    "js-engine",
    # The real text and icon payloads. A desktop host has the bytes and wants the quality, so the
    # vector faces and the Material Symbols outlines ship *in the profile* rather than in `default`.
    # This is what makes `--features desktop` and the manifest's `default` render the same picture —
    # the snapshots are exported with the former, so without this they showed 8x8 bitmap glyphs next
    # to a runtime that drew outlines. `mini`/`embedded` deliberately do not, being sized profiles.
    #
    # `fonts-emoji-color` is **desktop-only**: it is a 1.53 MB colour-bitmap face (Noto Color Emoji,
    # `CBDT` PNG glyphs), and emoji is a niche a tablet/mobile UI can drop without losing text
    # quality. The Latin, Arabic and CJK faces are the ones that make ordinary UI text antialiased,
    # so those go in all three capable profiles; emoji does not.
    "fonts-vector-latin",
    "fonts-complex",
    "fonts-cjk",
    "fonts-emoji-color",
    "icons",
    # The designer's code generator (mode 2). On by default for `desktop` only,
    # because `desktop` is the profile a designer **host** runs on: it is the
    # profile that has a window, a filesystem and an editor beside it.
    #
    # `tablet`/`mobile` deliberately do not enable it. They are **targets** of a
    # generation, not hosts (BLUE19 §5.3.4), and linking a code generator and its
    # artifact writer into a shipping application is the weight mode 2 exists to
    # remove. A caller who wants it there can ask: `--features tablet,designer`.
    "designer",
    "dep:chrono",
    "serde",
    "serde_json",
    "text-bidi",
]

## Tablet: touch-first, GPU, native controls, no desktop extras.
##
## Shares the desktop UI-compilation surface (JSON, i18n hot-reload watcher,
## chrono-backed widgets, serde) minus print/pdf/chart/a11y/js extras.
tablet = [
    "os-auto",
    "wgpu",
    "touch",
    "i18n",
    "desktop-runtime",
    "serde",
    "serde_json",
    "dep:chrono",
    "quality-management",
    "controls-native",
    "controls-custom",
    "image",
    "text-bidi",
    # The real text and icon payloads, for the same reason `desktop` carries them: a tablet host is
    # a sized-but-capable target that wants antialiased text and real outlines, not the 8x8 bitmap.
    # `mini`/`embedded` remain the profiles that carry neither. `fonts-emoji-color` is desktop-only
    # (see `desktop`), so it is deliberately absent here.
    "fonts-vector-latin",
    "fonts-complex",
    "fonts-cjk",
    "icons",
]

## Mobile: touch, GPU, mobile API, native controls.
mobile = [
    "os-auto",
    "wgpu",
    "touch",
    "i18n",
    "desktop-runtime",
    "serde",
    "serde_json",
    "dep:chrono",
    "quality-management",
    "mobile-api",
    "controls-native",
    "controls-custom",
    "image",
    "text-bidi",
    # The real text and icon payloads; see `tablet` above for why the profiles carry them now, and
    # why `fonts-emoji-color` is desktop-only.
    "fonts-vector-latin",
    "fonts-complex",
    "fonts-cjk",
    "icons",
]

## Embedded: software raster, no GPU, no touch, low memory.
embedded = ["software", "controls-custom", "text-bidi"]

## LVGL-style mini: ~15 core widgets, software raster, no alloc-heavy deps.
mini = [
    "software",
    "controls-custom",
    "text-bidi",
    "dep:heapless",
    "dep:hashbrown",
    "dep:spin",
    "dep:bumpalo",
]


# ── Axis 3: CAPABILITY OPT-OUTS ──

## Turn off the declarative view layer on a device profile.
##
## `rust_widgets::view` (the declarative-retained view layer) is **compiled by
## default** on `desktop`, `tablet` and `mobile`. It is never compiled on `mini`
## or `embedded`, which is a property of those profiles rather than a choice.
##
## Enabling this feature takes `crate::view` out of a device build. Use it when
## the layer's cost is not wanted — a headless tool, a size-constrained device
## build, or a program that only ever uses `add_child`:
##
##   cargo build --no-default-features --features desktop,no-declarative-view
##
## `tools/check_view_platform_gate.sh` asserts both states: the layer is present
## by default and absent when this feature is on.
##
## NOTE: the feature is deliberately *opt-out* rather than an `declarative-view`
## opt-in. A Cargo feature list cannot express "on unless named", so an opt-in
## spelling would require every existing caller to add a feature to keep working —
## a breaking change for a capability that is on today.
no-declarative-view = []

# ── Axis 2: OS BACKENDS (composable) ──
#
# Backend selection is performed by `cfg(target_os)` / `cfg(target_env)` arms in
# `src/platform/runtime.rs` and `src/platform/profile.rs` — a compile-time fact that
# Cargo features cannot express (a feature cannot say "whichever OS this target is").
#
# There used to be an `os-auto = []` feature here, documented as "picks by target_os",
# which `desktop`/`tablet`/`mobile` all enabled. Nothing anywhere read it: grepping
# for `feature = "os-auto"` over `src/` and `tools/` matched only the exclusion list in
# `check_capability_feature_gates.sh`. It is an empty name asserting a gate that does
# not exist (principle #47), so it is kept only as a documented no-op alias for build
# scripts that still pass it.
#
# Legacy no-op alias: does NOT select a backend. Kept so `--features os-auto` in an
# existing build script keeps working; new builds should name the backend feature
# (`macos`, `linux-gtk`, `ios`, `android`, `harmony`, `wasm`) or the device profile.
os-auto = []
macos = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-core-graphics",
    # The objc2 backend's handle types derive Serialize/Deserialize and its state
    # snapshot returns `serde_json::Error`, so these are hard requirements rather
    # than optional extras. They were previously inherited from `desktop`, which
    # made `--features macos` alone fail to compile.
    "serde",
    "serde_json",
]
macos-legacy = ["cocoa-legacy"]
ios = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-foundation",
    "dep:objc2-core-graphics",
    "dep:objc2-ui-kit",
]
windows = []
linux-gtk = ["dep:gtk"]
linux-wayland = [
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-cursor",
    "dep:libc",
]
linux-a11y = ["dep:zbus", "dep:pollster"]
android = ["dep:jni"]
# Explicit `jni` feature name so `--features jni` (documented by
# `src/bindings/java_jni.rs`) and `cfg(feature = "jni")` work; mirrors the
# `serde`/`dep:serde` pattern.
jni = ["dep:jni"]
wasm = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "serde"]
harmony = []
# The ArkUI **XComponent** bridge for the HarmonyOS backend: binds
# `OH_NativeXComponent` so the library gets a real surface plus touch/mouse/key/focus
# input instead of a state-only model.
#
# Off by default, and deliberately: turning it on makes the build link `ace_ndk` and
# needs the OpenHarmony SDK headers, so a build on a machine without the SDK must not
# be forced to have it. CI enables it only in the OHOS cross job (see
# `tools/check_harmony_cross.sh`).
#
# Needs the `harmony` backend to have anything to bind: enabling this alone is a no-op,
# which is why it is declared here beside it rather than as a standalone capability.
xcomponent = ["harmony"]


# ── Axis 3: CAPABILITIES (arbitrary composition) ──

touch = []
gpu = ["dep:wgpu"]
wgpu = ["gpu"]
software = []
i18n = ["dep:notify", "dep:crossbeam-channel", "dep:serde", "dep:serde_json"]
chart = []
print = []
pdf = []
a11y = []

## The designer's code generator and artifact writer (BLUE19 D7-b-3).
##
## Turns a project document into Rust source and writes it into `src/generated/`.
## It is a **development-time** tool: a shipping application has no use for it, and
## leaving it on would link a generator plus file writing into every build.
##
## `desktop` enables it (the designer runs on a desktop host); every other profile
## leaves it off and opts in explicitly when needed:
##   cargo build --features "tablet,designer"
##
## It needs `serde_json`, because generating requires *parsing* the project, and the
## `designer_tooling` alias in `build.rs` requires a device profile on top of this.
## Declaring the dependency here rather than in each profile keeps the alias honest:
## `--features tablet,designer` fails with a clear missing-dependency error instead
## of compiling a module that cannot read its input.
designer = ["serde_json"]

image = ["dep:miniz_oxide", "image-codecs", "svg-rasterizer"]
image-codecs = ["dep:image-codecs"]
svg-rasterizer = ["dep:resvg"]
# Video frames reuse the image format types (DecodedImage/ImageFormat).
video = ["dep:jpeg-decoder", "image"]
audio = ["dep:minimp3_fixed"]
holographic = []
projection = []

## Bidirectional text (UAX #9), resolved through `unicode-bidi`.
##
## This is *logic*, not font data: it reorders the clusters a line already produced so an
## Arabic or Hebrew run draws right-to-left and a mixed line draws in the order the Unicode
## algorithm specifies. It is pure `no_std` + `alloc`, so it can be on in every profile.
text-bidi = ["dep:unicode-bidi"]

## ── Text data ──
##
## The `fonts-*` features each append one *face* to the fallback stack
## (`render::text::active_stack`) and never replace the crate's historical 8x8 base face, so
## Latin output stays byte-identical whether they are on or off.
##
## `desktop`/`tablet`/`mobile` list the vector faces (Latin, Arabic, CJK, emoji) because a host
## with the bytes wants antialiased text; `mini`/`embedded` list none, because they are *sized* and
## a payload the caller did not ask for is exactly wrong there. `default` names `desktop` and
## nothing else, so a plain `cargo build` gets the real faces *through the profile* — which is what
## lets `--features desktop` (the crate's own export/test surface) and a plain `cargo build` render
## the same picture. `tools/check_font_data_is_opt_in.sh` asserts the split.
## Real text shaping: ligatures, Arabic joining and kerning, from a face the caller enables.
##
## Shaping needs a face — it substitutes and positions glyphs by the font's own tables — so this
## feature is only useful with one of the `fonts-*` data features below, which imply it.
##
## It is still a *separate* axis from the data (constraint 2 of BLUE23 §0A.4's three): a CJK
## bitmap face needs no shaping at all, so `fonts-cjk-bitmap` does not enable this.
text-shaping = ["dep:rustybuzz", "dep:ttf-parser"]

## `fonts-cjk-bitmap` adds a generated 16x16 CJK bitmap subset (Han, kana, CJK
## punctuation and fullwidth forms; ~85 KB of read-only data read on demand). A CJK
## character is one cell, so this needs no shaping engine.
fonts-cjk-bitmap = []

## Vector faces. Unlike the bitmap face above these carry outlines and layout tables, so they
## answer two questions the bitmap face cannot: real advances and kerning, and the contextual
## substitutions complex scripts need (`arabic` carries the `GSUB` joining features).
##
## They also *draw*: `render::text::raster` rasterises their outlines into antialiased coverage at
## whatever size the caller asked for, which is G-5. A build with one of these faces gets
## antialiased text; the default build's 8x8 face stays 1-bit, byte-identical to what it always drew.
fonts-vector-latin = ["text-shaping"]
fonts-complex = ["text-shaping"]

## `fonts-cjk` adds a **scalable** CJK vector face (`NotoSansSC`, outlines) — the counterpart to
## `fonts-cjk-bitmap` above, and a different trade.
##
## # Why both exist, and why this one is not the default CJK answer
##
## Measured against Noto Sans SC, subset to the codepoints in `tools/cjk_vector_codepoints.txt`:
##
## | face | coverage | size |
## |---|---|---|
## | `fonts-cjk-bitmap` | 2361 glyphs, fixed 16x16 | ~85 KB |
## | `fonts-cjk` | 2053 glyphs, outlines, any size | ~353 KB |
##
## An outline is inherently several times a 16x16 bitmap, so a vector face at the bitmap's *own*
## coverage weighs 581 KB — 7x. That is why BLUE23 §0A.4 constraint 2 keeps CJK on the bitmap for
## `mini`/`embedded` (data, no shaping engine, 85 KB) and why this face exists for the *other* case:
## a `desktop`/`tablet` host that wants Chinese antialiased at any px size (G-5).
##
## # What it enables that the bitmap cannot
##
## Two things, and both need the shaping feature:
##
##   * **Real advances and kerning.** A CJK ideograph is one full-width cell either way, but a line
##     of mixed Chinese and Latin needs the Latin advances from the same face that supplied the Han;
##   * **Any px size.** A 16x16 bitmap scaled to 14 px or to 96 px is visibly coarse; an outline
##     is rasterised at exactly the requested size.
##
## Because it carries outlines and layout tables, this feature implies `text-shaping`.
fonts-cjk = ["text-shaping"]

## ── The CJK vector face, sharded on Unicode block boundaries ──
##
## `fonts-cjk-shards` is a meta-feature: it turns on every shard below. Each shard is the **same
## codepoints** as the corresponding range of `fonts-cjk`, split so a host that draws one script
## loads one script's glyphs. `tools/check_cjk_shards_cover_the_face.sh` asserts the partition
## equals `tools/cjk_vector_codepoints.txt`, so the shards and the one-face build cover the same
## characters.
##
## # Why shards, and why they do not replace `fonts-cjk`
##
## `fonts-cjk` is the one-file answer for a host that wants all of CJK resident. The shards exist
## for the host that would rather not: an all-English UI never touches `fonts-cjk-shard-han`, and a
## Japanese UI loads `kana` without Han. Both are the same coverage — the shards are a split, not a
## different subset — so a host chooses by whether it wants everything at once or one script at a
## time. See `tools/cjk_vector_shards.txt` for the boundaries and why they follow Unicode blocks.
##
## Each shard implies `text-shaping` for the same reason `fonts-cjk` does: it carries outlines and
## layout tables.
fonts-cjk-shards = [
    "fonts-cjk-shard-latin",
    "fonts-cjk-shard-symbols",
    "fonts-cjk-shard-kana",
    "fonts-cjk-shard-fullwidth",
    "fonts-cjk-shard-han",
]

## ASCII, so a mixed line's advances and kerning come from one face.
fonts-cjk-shard-latin = ["text-shaping"]
## CJK Symbols and Punctuation.
fonts-cjk-shard-symbols = ["text-shaping"]
## Hiragana and Katakana, including the voiced-mark range.
fonts-cjk-shard-kana = ["text-shaping"]
## Halfwidth and Fullwidth Forms.
fonts-cjk-shard-fullwidth = ["text-shaping"]
## Han: the 800 most common ideographs.
fonts-cjk-shard-han = ["text-shaping"]

## `fonts-emoji-color` adds a colour emoji face: `CBDT`/`CBLC` bitmap glyphs, each a PNG, plus the
## PNG decoder that reads them — G-6.
##
## # Why this is a different axis from the vector faces
##
## A colour glyph is not an outline with colour: it is a designer's *rendering* at one size, stored
## as compressed pixels. So this face needs no shaper (there is nothing to substitute) and no
## rasteriser (there is nothing to outline), and it is not implied by `text-shaping`.
##
## # What it costs
##
## The payload is a subset of Noto Color Emoji at 109 ppem — see `NOTICE`. Measured on the shipped
## subset: 1,602,492 bytes of `CBDT` data covering 317 codepoints. (The upstream face is 10,730,124
## bytes; the subset is generated from it by `tools/gen_emoji_subset.py`, and the codepoints are
## chosen in `tools/emoji_subset_codepoints.txt`. The much smaller
## `NotoColorEmoji-flagsonly.ttf` is *not* usable — see that generator's module docs.)
##
## That size — 1.53 MB, an order of magnitude more than the vector faces — is why it ships in
## `desktop` alone rather than in every capable profile: emoji is a niche a tablet/mobile UI can
## drop without losing text quality, while the Latin/Arabic/CJK faces are what make ordinary UI text
## antialiased. It is still *not* in `default` directly (nothing is): `default` names `desktop`, and
## only `desktop` carries this face. A tablet/mobile host that wants it asks: `--features tablet,fonts-emoji-color`.
##
## # Why it does not need `text-shaping`
##
## `ttf-parser` alone resolves a character to a glyph id through `cmap`, which is all a colour face
## needs — there is no `GSUB`/`GPOS` step. So the two features can be enabled independently, and
## every combination of them builds (the reference-count matrix in `docs/plans/archive/blue23.md` §0A.4
## lists them).
fonts-emoji-color = ["dep:ttf-parser"]

## `runtime-fonts` lets a host register its own face at runtime:
## `text::register_face("My Family", bytes)` installs a `&'static [u8]` that is consulted **before**
## every compiled face, so a system font (PingFang, Microsoft YaHei, a Noto this crate does not ship)
## is usable without recompiling the library.
##
## # Why this is a separate axis
##
## It ships **no data**. The bytes are the host's, so this feature adds a registry (four slots and a
## mutex) and nothing else — it is orthogonal to the `fonts-*` data features and to `icons`, and a
## build may have any combination. It implies `text-shaping` because that is the engine that reads a
## face's outlines and layout tables; a runtime face on a build with no shaper has no consumer.
##
## # Why the bytes are `&'static [u8]`
##
## The face list is read per glyph from threads that hold no lock (`FaceBytes` is `Copy` and the
## list is `&'static`). An owned buffer would force a lock on that path or a leak the caller cannot
## see; a `&'static [u8]` is what `include_bytes!` or an explicit `Box::leak` gives, and the leak is
## paid once. See the module docs for the full argument.
##
## # Size
##
## Negligible: the payload is the caller's, and the registry is `[Option<FaceBytes>; 4]` plus a
## counter. This feature is safe to enable anywhere `text-shaping` is.
runtime-fonts = ["text-shaping"]

## `icons` adds the Material Symbols icon data: one SVG path per `IconName` token.
##
## # Why this is in the device profiles, and not in `default`
##
## The payload is upstream's outlines copied verbatim (see `NOTICE` and
## `tools/material_symbols/`). It is **data**, and where it belongs is decided by what a build is:
##
##   * a **device profile** answers "what kind of machine is this". `desktop`/`tablet`/`mobile` are
##     hosts with the bytes to spare and a reason to want real outlines, so they list `icons`.
##     `mini` and `embedded` are *sized*, so a payload the caller did not ask for is exactly wrong
##     there — neither lists it.
##   * `default` names `desktop` and nothing else, so a plain `cargo build` still gets the real
##     outlines *through the profile*. Keeping the data in the profiles rather than in `default` is
##     what makes `--features desktop` (which the crate's own gates export and test) agree with a
##     plain `cargo build`.
##
## A caller who does not want the payload builds a profile that omits it (`mini`/`embedded`), or a
## `desktop` build with `--no-default-features --features desktop` no longer drops it — the rejection
## path is now the sized profiles. `tools/check_icon_data_is_opt_in.sh` asserts all of this: `icons`
## is present in `desktop`/`tablet`/`mobile`, absent from `default`/`embedded`/`mini`, and the crate
## builds both with it and without it.
##
## # What it changes
##
## With the feature on, each `IconName` resolves to its Material Symbols outline. Without it,
## `Icon::draw` uses the crate's hand-written geometric shapes, so a build with no icon data
## renders the icons it always did — that path is kept for exactly this reason, and it is what
## every snapshot taken before the data existed was drawn against.
##
## `tools/check_icon_data_is_opt_in.sh` asserts all three facts: `icons` is in
## `desktop`/`tablet`/`mobile`, `icons` is absent from `default` and from the sized profiles
## (`embedded`/`mini`), and the crate builds with it off and with it on.
##
## # Licensing
##
## Apache-2.0 (Google LLC); the licence copy ships at `tools/material_symbols/LICENSE` and the
## attribution is recorded in the repository-root `NOTICE`. `tools/check_icon_licences.sh`
## asserts both, because a feature gate is not a licence gate.
icons = []


# ── INTERNAL FEATURES (used by profiles, not user-facing) ──

desktop-runtime = ["dep:notify", "dep:crossbeam-channel"]
quality-management = []
mobile-api = []
controls-native = []
controls-custom = []
advanced-widgets = ["dep:dirs"]
# Internal runtime-profile selector referenced by `runtime_profile_name()`
# (`src/lib.rs`); selects the "embedded-mini" profile combination.
profile-embedded-mini = []

# New capability features
# Note: pdf-encryption, audio-output, js-engine are cross-platform (Pure Rust / system-agnostic).
# video-codecs is cross-platform when system FFmpeg is installed.
# `webkit-engine` was here (Linux-only, gating a wrapper over webkit2gtk). Deleted by
# BLUE20 layer 5 (ruling W1) because the wrapper never displayed a page; the feature
# promised a rendering engine the library did not have.
pdf-encryption = ["aes", "sha2", "cbc", "dep:getrandom"]
audio-output = ["cpal"]
js-engine = ["boa_engine"]
video-codecs = ["dep:ffmpeg-next"]
web-http = ["dep:ureq"]

# Explicit feature flag so `cfg(feature = "serde")` works with `dep:serde`.
serde = ["dep:serde"]
serde_json = ["dep:serde_json"]

unstable-pipeline-routing = []
unstable-special-widgets = []


# ── AUDIO CODEC FEATURES ──

## Real audio codecs via symphonia (FLAC, OGG Vorbis, AAC, Opus).
## Enables actual PCM decoding instead of synthetic fallback data.
symphonia-codecs = ["symphonia"]


# ── BACKWARD-COMPAT ALIASES ──
# Old feature names used in #[cfg(feature = "...")] throughout the codebase.
# These forward to the new names above.

# Old OS backends
objc2-macos = ["macos"]

# `cocoa-legacy` is the name the macOS backend modules are gated on
# (`#[cfg(feature = "cocoa-legacy")]` in `src/platform/macos/`), so it is the one
# that must carry the cocoa/objc dependencies. `macos-legacy` is the documented
# user-facing alias and forwards to it.
#
# The alias used to point the other way (`cocoa-legacy = ["macos-legacy"]`), which
# meant `--features macos-legacy` pulled in the crate but never activated the gate
# the backend modules are written against: the backend was never compiled, and the
# build failed on a missing type instead of using the legacy backend it had asked
# for. Direction matters, because a Cargo feature alias is not symmetric.
#
# `serde`/`serde_json` are hard requirements here for the same reason documented on
# `macos` above: enabling `cocoa-legacy` also compiles `src/platform/macos_objc2/`
# (both backends ship behind the Apple gate), whose handle types derive
# Serialize/Deserialize and whose state snapshot returns `serde_json::Error`.
# Only `macos` used to carry them, so `--features cocoa-legacy` alone failed with
# `unresolved import serde` — the identical defect the `macos` line was patched for.
cocoa-legacy = ["dep:cocoa", "dep:objc", "serde", "serde_json"]
ios-uikit-ffi = ["ios"]
gtk-native = ["linux-gtk"]
wayland-native = ["linux-wayland"]
android-jni = ["android", "jni"]

# Old capability names
gpu-wgpu = ["gpu", "dep:pollster"]


# ── META FEATURES ──

## Everything (not for production — pick a specific device profile).
full = [
    "desktop",
    "macos",
    "macos-legacy",
    "ios",
    "linux-gtk",
    "linux-wayland",
    "linux-a11y",
    "android",
    "wasm",
    "harmony",
    "holographic",
    "projection",
    "unstable-pipeline-routing",
    "unstable-special-widgets",
    "pdf-encryption",
    "symphonia-codecs",
    "audio-output",
    "js-engine",
    "video-codecs",
]


