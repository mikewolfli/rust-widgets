[package]
name = "rust_widgets"
version = "0.1.0"
edition = "2021"
description = "Pure Rust cross-platform native GUI architecture"
license = "MIT"
rust-version = "1.70"
repository = "https://github.com/mikewolfli/rust-widgets"
homepage = "https://github.com/mikewolfli/rust-widgets"
documentation = "https://docs.rs/rust_widgets"
readme = "README.md"
keywords = ["gui", "widgets", "native", "cross-platform", "ffi"]
categories = ["gui", "api-bindings"]

[lints.rust]
unexpected_cfgs = "allow"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["full"]
full = ["desktop-runtime", "print", "pdf", "chart"]
desktop-runtime = ["dep:serde_json", "dep:lazy_static", "dep:roxmltree"]
embedded = []
mobile-api = []
print = []
pdf = []
chart = []
gtk-native = ["gtk"]
harmony-native = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
threadpool = "1.8"
crossbeam-channel = "0.5"
lazy_static = { version = "1.4", optional = true }
roxmltree = { version = "0.21", optional = true }
font8x8 = "0.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "commctrl"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
objc_id = "0.1"
cocoa = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "harmony")'.dependencies]
# dependency for Huawei HarmonyOS, if applicable. Placeholder for now since HarmonyOS support is in early stages and may require custom bindings or FFI.

