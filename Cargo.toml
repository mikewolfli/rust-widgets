[package]
name = "rust_widgets"
version = "0.6.0"
edition = "2021"
description = "Pure Rust cross-platform native GUI architecture"
license = "MIT"
rust-version = "1.70"
repository = "https://github.com/mikewolfli/rust-widgets"
homepage = "https://github.com/mikewolfli/rust-widgets"
documentation = "https://docs.rs/rust_widgets"
readme = "README.md"
keywords = ["gui", "widgets", "native", "cross-platform", "ffi"]
categories = ["gui", "api-bindings"]

[lints.rust]
unexpected_cfgs = "allow"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["full"]
full = ["desktop-runtime", "print", "pdf", "chart", "control-policy-hybrid"]
desktop-runtime = ["dep:serde_json", "dep:lazy_static", "dep:roxmltree"]
embedded = []
mobile-api = []
gpu-wgpu = ["dep:wgpu", "dep:pollster"]
objc2-macos = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
print = []
pdf = []
chart = []
gtk-native = ["gtk"]
harmony-native = []
controls-native = []
controls-custom = []
control-policy-native-strict = ["controls-native"]
control-policy-hybrid = ["controls-native", "controls-custom"]
control-policy-custom-full = ["controls-custom"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
threadpool = "1.8"
crossbeam-channel = "0.5"
lazy_static = { version = "1.4", optional = true }
roxmltree = { version = "0.21.1", optional = true }
font8x8 = "0.3"
wgpu = { version = "0.17", optional = true }
pollster = { version = "0.3", optional = true }
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "commctrl"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
objc_id = "0.1"
cocoa = "0.26.1"
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "harmony")'.dependencies]
# dependency for Huawei HarmonyOS, if applicable. Placeholder for now since HarmonyOS support is in early stages and may require custom bindings or FFI.

[[example]]
name = "demo_basic"
path = "demos/demo_basic.rs"

[[example]]
name = "demo_treeview"
path = "demos/demo_treeview.rs"

[[example]]
name = "demo_tableview"
path = "demos/demo_tableview.rs"

[[example]]
name = "demo_listview"
path = "demos/demo_listview.rs"

[[example]]
name = "demo_tabwidget"
path = "demos/demo_tabwidget.rs"

[[example]]
name = "demo_splitter"
path = "demos/demo_splitter.rs"

[[example]]
name = "demo_dockpanel"
path = "demos/demo_dockpanel.rs"

[[example]]
name = "demo_mdiarea"
path = "demos/demo_mdiarea.rs"
