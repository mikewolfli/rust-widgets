[package]
name = "rust_widgets"
version = "0.0.1"
edition = "2021"
description = "Pure Rust cross-platform native GUI architecture"
license = "MIT"

[lints.rust]
unexpected_cfgs = "allow"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["full"]
full = ["print", "pdf", "chart"]
embedded = []
mobile-api = []
print = []
pdf = []
chart = []
gtk-native = ["gtk"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
threadpool = "1.8"
crossbeam-channel = "0.5"
lazy_static = "1.4"
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "commctrl"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
objc_id = "0.1"
cocoa = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.16", optional = true }

[target.'cfg(target_os = "harmony")'.dependencies]
# 鸿蒙相关依赖

