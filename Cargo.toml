[package]
name = "rust_widgets"
version = "0.9.6"
edition = "2021"
description = "Pure Rust cross-platform native GUI library with hardware-adaptive rendering, 60+ widgets, touch/gesture support, i18n, and SVG-pipeline-accurate output"
license = "MIT"
keywords = ["gui", "ui", "widget", "cross-platform", "native", "mobile", "reactive", "wasm"]
categories = ["gui", "rendering", "graphics", "development-tools", "embedded", "multimedia", "web-programming"]
authors = ["Mike Wolfli <mikewolfli@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/mikewolfli/rust-widgets"
repository = "https://github.com/mikewolfli/rust-widgets"
rust-version = "1.87"
include = ["src/**/*", "tests/**/*", "benches/**/*", "examples/**/*", "include/**/*", "LICENSE", "README.md", "README.zh-CN.md", "CHANGELOG.md", "clippy.toml", "rustfmt.toml"]
exclude = [".github/**/*", ".cargo/**/*", ".vscode/**/*", "tools/**/*", "docs/**/*", "target/**/*"]

[lints.rust]
unexpected_cfgs = "allow"

[lib]
crate-type = ["lib", "cdylib"]

[features]
# ── Device-class profiles (pick ONE; `desktop` is the default) ──
default = ["desktop"]
## Full desktop PC: native platform, i18n, theme, bindings, touch, GPU.
desktop = ["desktop-runtime", "gpu-wgpu", "quality-management", "controls-native", "controls-custom", "advanced-widgets", "print", "pdf", "chart"]
## Tablet: touch-enabled, GPU-accelerated, native + custom controls.
tablet = ["touch", "gpu-wgpu", "quality-management", "controls-native", "controls-custom"]
## Mobile phone: touch-enabled, GPU-accelerated, mobile API bindings, native + custom controls.
mobile = ["touch", "gpu-wgpu", "quality-management", "mobile-api", "controls-native", "controls-custom"]
## Embedded/stripped: no touch, no i18n, software-only render.
embedded = []

# ── Interaction features (composable atop device profiles) ──
## Touch events + 11 gesture recognizers (Tap, DoubleTap, LongPress, Swipe,
## Pan, Fling, TwoFingerTap, TwoFingerSwipe, LongPressDrag, Pinch, Rotate).
touch = []
## Laser holographic keyboard/screen (Z-axis depth events).
holographic = []
## Projection/remote-control (air gestures, pointer input).
projection = []

# ── Runtime / platform backend features ──
desktop-runtime = []
gpu-wgpu = ["wgpu"]
quality-management = []
mobile-api = []
gtk-native = ["dep:gtk"]
wayland-native = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-cursor"]
controls-native = []
objc2-macos = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-core-graphics"]
ios-uikit-ffi = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-ui-kit"]
controls-custom = []

# ── WASM platform support (browser via wasm-bindgen + web-sys) ──
wasm = ["dep:wasm-bindgen", "dep:web-sys"]

# ── Android JNI bridge (optional, creates real native views on Android) ──
android-jni = ["dep:jni"]

# ── Optional content modules ──
print = []
pdf = []
chart = []
advanced-widgets = []

# ── Unstable / experimental features ──
unstable-pipeline-routing = []
unstable-special-widgets = []

linux-a11y = ["zbus"]

# ── Meta-feature: everything that can coexist ──
# NOTE: device-class features (desktop/tablet/mobile/embedded) are
# mutually exclusive and NOT combined here. Pick one device profile
# and compose with interaction add-ons as needed.
full = ["desktop", "touch", "holographic", "projection", "wayland-native", "gtk-native", "objc2-macos", "ios-uikit-ffi", "android-jni", "mobile-api", "wasm", "print", "pdf", "chart", "advanced-widgets", "unstable-pipeline-routing", "unstable-special-widgets"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "Event", "MouseEvent", "KeyboardEvent", "console"], optional = true }
serde_json = "1.0"
threadpool = "1.8"
crossbeam-channel = "0.5"
font8x8 = "0.2.7"
pollster = "0.3"
chrono = "0.4"
notify = "6.1"
dirs = "5.0"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "commctrl", "commdlg", "winbase", "synchapi",
    "wingdi", "shellapi", "ole2", "combaseapi", "objbase",
    "knownfolders", "shlobj",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3", optional = true }
objc2-core-graphics = { version = "0.3", optional = true }
cocoa = "0.24"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-ui-kit = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["staging", "client"], optional = true }
wayland-cursor = { version = "0.31", optional = true }
zbus = { version = "5", optional = true }

[target.'cfg(target_os = "harmony")'.dependencies]
# HarmonyOS support is in early evaluation stage. Custom FFI bindings
# will be required for native control creation and event handling.
# This section is reserved for future implementation.

[dependencies.wgpu]
version = "29.0.3"
optional = true

[dependencies.jni]
version = "0.21"
features = ["invocation"]
optional = true

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.8"

[package.metadata.docs.rs]
features = ["full", "touch", "holographic", "projection"]
rustc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bench]]
name = "render_bench"
harness = false

[[bench]]
name = "signal_bench"
harness = false

[[bench]]
name = "layout_bench"
harness = false

[[bench]]
name = "json_bench"
harness = false

[[bench]]
name = "event_bench"
harness = false
