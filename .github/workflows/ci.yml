name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check

      - name: Cargo check examples
        run: cargo check --examples

  validation-gates:
    name: Validation gates (profiles + ABI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run profile matrix gate
        shell: bash
        run: |
          chmod +x tools/check_profiles.sh
          ./tools/check_profiles.sh

      - name: Run ABI gate
        shell: bash
        run: |
          chmod +x tools/check_abi.sh
          ./tools/check_abi.sh

      - name: Run signal-first event model gate
        shell: bash
        run: |
          chmod +x tools/check_event_model_signal_first.sh
          ./tools/check_event_model_signal_first.sh

  feature-completeness-matrix:
    name: Feature completeness matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate feature completeness report
        shell: bash
        run: |
          chmod +x tools/check_feature_completeness_matrix.sh
          ./tools/check_feature_completeness_matrix.sh

      - name: Upload feature completeness artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-completeness-matrix
          path: target/qa/feature_completeness_matrix.md

  quality-gates:
    name: Quality gates (test + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo test (all features)
        run: cargo test --all-features -q

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo bench compile check
        run: cargo bench --no-run
