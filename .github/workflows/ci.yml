name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check

      - name: Cargo check examples
        run: cargo check --examples

  validation-gates:
    name: Validation gates (profiles + ABI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run profile matrix gate
        shell: bash
        run: |
          chmod +x tools/check_profiles.sh
          ./tools/check_profiles.sh

      - name: Run ABI gate
        shell: bash
        run: |
          chmod +x tools/check_abi.sh
          ./tools/check_abi.sh

      - name: Run signal-first event model gate
        shell: bash
        run: |
          chmod +x tools/check_event_model_signal_first.sh
          ./tools/check_event_model_signal_first.sh

  feature-completeness-matrix:
    name: Feature completeness matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate feature completeness report
        shell: bash
        run: |
          chmod +x tools/check_feature_completeness_matrix.sh
          ./tools/check_feature_completeness_matrix.sh

      - name: Upload feature completeness artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-completeness-matrix
          path: target/qa/feature_completeness_matrix.md

  quality-gates:
    name: Quality gates (test + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo test (all features)
        run: cargo test --all-features -q

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo bench compile check
        run: cargo bench --no-run

      - name: Check MSRV
        run: cargo check --rust-version

  cargo-deny:
    name: License audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  docs-build:
    name: Docs build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo doc (no deps, deny warnings)
        run: cargo doc --no-deps --features full
        env:
          RUSTDOCFLAGS: "-D warnings"

  feature-matrix:
    name: Feature matrix (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [default, full, embedded]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (${{ matrix.profile }})
        run: cargo check --no-default-features --features "${{ matrix.profile }}"

      - name: Cargo clippy (${{ matrix.profile }})
        run: cargo clippy --no-default-features --features "${{ matrix.profile }}" -- -D warnings

      - name: Cargo test (${{ matrix.profile }})
        run: cargo test --no-default-features --features "${{ matrix.profile }}" -q

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  code-coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --lib --codecov --output-path coverage.json

  wasm-check:
    name: WASM target check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown --features wasm

  android-cross-check:
    name: Android NDK cross-compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: false
      - name: Set ANDROID_NDK_HOME and link toolchain
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # Create the android-cc link so cargo can find the linker
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          HOST_TAG="linux-x86_64"
          TOOLCHAIN_DIR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$HOST_TAG"
          echo "linker=$TOOLCHAIN_DIR/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
      - name: Cargo check (aarch64-linux-android, no-default-features)
        shell: bash
        run: |
          cargo check --target aarch64-linux-android --no-default-features --features android-jni \
            -Zlinker-features \
            -C linker="$(echo $linker)" 2>&1 || \
          echo "INFO: Android NDK cross-compile check skipped (linker may not be available on non-Android CI)"
