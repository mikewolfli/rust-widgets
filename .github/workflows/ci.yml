name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check

      - name: Cargo check examples
        run: cargo check --examples

  validation-gates:
    name: Validation gates (profiles + ABI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run profile matrix gate
        shell: bash
        run: |
          chmod +x tools/check_profiles.sh
          ./tools/check_profiles.sh

      - name: Run ABI gate
        shell: bash
        run: |
          chmod +x tools/check_abi.sh
          ./tools/check_abi.sh

      # The C ABI header is the contract every binding compiles against, so a
      # symbol that exists in Rust but not in a binding is an unreachable
      # capability (principle #71).
      - name: Run binding symbol coverage gate
        shell: bash
        run: |
          chmod +x tools/check_binding_symbol_coverage.sh
          ./tools/check_binding_symbol_coverage.sh

      - name: Run JNI signature gate
        shell: bash
        run: |
          chmod +x tools/check_jni_signatures.sh
          ./tools/check_jni_signatures.sh

      # Every `WidgetKind` must be registered, aliased, or explicitly marked a
      # base/child kind. Six fully implemented controls had no registration row at
      # all, so they were unreachable from the name-based API and invisible to CSS
      # selectors while every other gate stayed green.
      - name: Run widget registration fidelity gate
        shell: bash
        run: |
          chmod +x tools/check_widget_registration_fidelity.sh
          ./tools/check_widget_registration_fidelity.sh

      # Every control must have at least one test that builds it. `Toast` shipped
      # with none while every other gate passed: it was registered, had a contract,
      # was reachable from JSON, CSS and the C ABI, and had a matrix row — and none
      # of those asks whether anything ever mounts the control.
      - name: Run control test coverage gate
        shell: bash
        run: |
          chmod +x tools/check_control_has_tests.sh
          ./tools/check_control_has_tests.sh

      # Every gesture event must have a production construction site. `DoubleTap`
      # shipped unreachable: the engine returned on the first recognizer that fired,
      # and `TapGesture` sits earlier in the chain and satisfies every second tap.
      # The recognizer was correct and its own tests passed — because they drove it
      # directly instead of through the engine.
      - name: Run event producer gate
        shell: bash
        run: |
          chmod +x tools/check_event_producers.sh
          ./tools/check_event_producers.sh

      # Every `pub mod` must state whether it has production callers, is exposed
      # over the C ABI, or is a deliberate experiment. Without this, a module with
      # no consumer is indistinguishable from one whose consumer was deleted, and
      # nothing in a diff reveals it.
      - name: Run module reachability gate
        shell: bash
        run: |
          chmod +x tools/check_module_reachability.sh
          ./tools/check_module_reachability.sh

      - name: Run documentation count consistency gate
        shell: bash
        run: |
          chmod +x tools/check_widget_kind_count.sh
          ./tools/check_widget_kind_count.sh

      # `embedded_target_fps_clamps` flaked because two modules declared separate test
      # mutexes over one process-wide embedded engine — two locks over one resource
      # exclude nothing. The flake passed on retry, so it read as environmental. This
      # turns it into a static property instead of something a person has to reproduce.
      - name: Run test-guard uniqueness gate
        shell: bash
        run: |
          chmod +x tools/check_test_guard_uniqueness.sh
          ./tools/check_test_guard_uniqueness.sh

      - name: Run signal-first event model gate
        shell: bash
        run: |
          chmod +x tools/check_event_model_signal_first.sh
          ./tools/check_event_model_signal_first.sh

      # BLUE15's central rule: one creation mechanism. Source-level, so it runs on
      # any host — including runners that cannot compile the macOS/iOS/Android
      # backends and would otherwise never notice a reintroduced control path.
      - name: Run single-creation-mechanism gate
        shell: bash
        run: |
          chmod +x tools/check_single_creation_mechanism.sh
          ./tools/check_single_creation_mechanism.sh

      # The cookbook is the user-facing API reference and nothing compiles it, so
      # a renamed or deleted item leaves it confidently wrong (principle #18).
      # This gate checks that every API name the cookbook declares exists in src/
      # and that all three books still build with no warnings.
      - name: Install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Run cookbook gate
        shell: bash
        run: |
          chmod +x tools/check_cookbook.sh
          ./tools/check_cookbook.sh

      # `check_cookbook.sh` verifies the cookbook's *Rust* declarations and builds
      # the books, but it deliberately does not compile prose code blocks, and
      # `check_abi.sh` reads the header rather than the cookbook. So the C a reader
      # is told to write was checked by nothing — which is how a called-but-absent
      # `rw_combo_box_add_item`, a non-existent `rust_widgets.h`, and a block of
      # Harmony signatures that disagreed with the header all survived in the
      # prose. This gate compiles every ```c block and checks every `rw_*` name in
      # it against the published header.
      - name: Run C code example gate
        shell: bash
        run: |
          chmod +x tools/check_c_code_examples.sh
          ./tools/check_c_code_examples.sh

      # `missing_docs` is denied crate-wide and intra-doc links are checked under
      # `-D warnings`. Broken links are invisible in normal builds (rustdoc renders
      # them as plain text), so they need their own gate — it already caught links
      # to a removed module, to items compiled out of `mini`, and to private
      # constants.
      - name: Run documentation gate
        shell: bash
        run: |
          chmod +x tools/check_docs.sh
          ./tools/check_docs.sh

  theme-fixtures:
    name: Theme fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `themes/*.json` is the checked-in description of the theme file format, and
      # nothing else in the build reads it. A field rename or a serde change would
      # otherwise break every user's theme file while every test stayed green. The
      # gate checks the fixtures round-trip **and** that regenerating from the
      # built-in presets reproduces them byte for byte, which is what stops them
      # drifting.
      - name: Run theme fixture gate
        shell: bash
        run: |
          chmod +x tools/check_theme_fixtures.sh themes/generate.sh
          ./tools/check_theme_fixtures.sh

  feature-completeness-matrix:
    name: Feature completeness matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate feature completeness report
        shell: bash
        run: |
          chmod +x tools/check_feature_completeness_matrix.sh
          ./tools/check_feature_completeness_matrix.sh

      - name: Upload feature completeness artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-completeness-matrix
          path: target/qa/feature_completeness_matrix.md

  quality-gates:
    name: Quality gates (test + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo test (all features)
        run: cargo test --all-features -q

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo bench compile check
        run: cargo bench --no-run

      # Benchmarks that nobody compares against anything cannot fail, so "the hot
      # paths are still fast" stays an opinion. This runs the two paths TODO.md names
      # as performance-critical and checks them against a recorded baseline (3x
      # tolerance, because shared CI runners are noisy). It catches the class of
      # regression that matters here — a new per-frame allocation or a lost
      # short-circuit — which shows up as 10x or worse, not 30%.
      - name: Performance regression gate
        shell: bash
        run: |
          chmod +x tools/check_perf.sh
          ./tools/check_perf.sh

      # Widget state lives in thread-local registries, so a lock on that path is
      # overhead without a purpose and risks a single-threaded deadlock. The gate
      # asserts that structurally (a grep of the production regions of src/widget/),
      # which is checkable in a way that "lock contention was profiled once" is not.
      # Its own self-test runs first: the matcher is Python embedded in a shell script,
      # and a bug in it does not raise — it reports PASS on code it never read. That
      # happened three times before the self-test existed, each caught only by reverse
      # injection.
      - name: Locking audit gate
        shell: bash
        run: |
          chmod +x tools/check_locking.sh
          python3 tools/test_check_locking.py
          ./tools/check_locking.sh

      - name: Check MSRV
        run: cargo check --rust-version

  cargo-deny:
    name: License audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  docs-build:
    name: Docs build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo doc (no deps, deny warnings)
        run: cargo doc --no-deps --features full
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ── Linux GTK backend (the only job that compiles `gtk-native`) ──
  #
  # `gtk-native` was absent from every matrix, so nothing compiled the GTK
  # backend: it accumulated six classes of error (bare `glib`/`gdk`/`cairo` names,
  # a missing `MutexExt` import, a `Fixed`-vs-child `move_`, an unsafe `destroy`)
  # and a main-thread SIGSEGV at runtime without a single red check. The profile
  # matrix cannot cover it, because `desktop` does not imply `gtk-native` and
  # `--all-features` turns `mini` on at the same time, which strips the very
  # modules under test. This job pins the combination explicitly.
  linux-gtk:
    name: Linux GTK backend (gtk-native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The system dependency of the `gtk` crate; `build.rs` names the same
      # package in its diagnostic for developers.
      - name: Install GTK 3 development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev
          pkg-config --modversion gtk+-3.0

      # A display is present on the runner, and the backend's own tests assert the
      # GDK clipboard round-trip when GTK initializes, so the suite runs as-is.
      - name: Cargo check (desktop + gtk-native)
        run: cargo check --no-default-features --features "desktop,gtk-native" --all-targets

      - name: Cargo clippy (desktop + gtk-native)
        run: >-
          cargo clippy --no-default-features --features "desktop,gtk-native"
          --all-targets -- -D warnings

      - name: Cargo test (desktop + gtk-native)
        run: cargo test --no-default-features --features "desktop,gtk-native" -q

      # GTK binds a process to one main thread, and several tests construct
      # windows. Running the suite repeatedly catches the class of regression that
      # produced intermittent panics and a SIGSEGV in the first place, which a
      # single green run can miss.
      - name: Cargo test repeated (GTK main-thread stability)
        run: |
          for run in 1 2 3; do
            echo "--- run $run ---"
            cargo test --no-default-features --features "desktop,gtk-native" --lib -q
          done

  feature-matrix:
    name: Feature matrix (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [default, full, embedded, mini]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (${{ matrix.profile }})
        run: cargo check --no-default-features --features "${{ matrix.profile }}"

      - name: Cargo clippy (${{ matrix.profile }})
        run: cargo clippy --no-default-features --features "${{ matrix.profile }}" -- -D warnings

      - name: Cargo test (${{ matrix.profile }})
        run: cargo test --no-default-features --features "${{ matrix.profile }}" -q

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  code-coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --lib --codecov --output-path coverage.json

  wasm-check:
    name: WASM target check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm
      # The JavaScript engine pulls `rand` 0.8 -> `getrandom` 0.2, which refuses to
      # build for wasm32 without its entropy backend enabled. `Cargo.toml` turns
      # that feature on for this target, and this step keeps the combination from
      # regressing silently: the plain `wasm` build above does not cover it.
      - name: WASM check (with JavaScript engine)
        run: >-
          cargo check --target wasm32-unknown-unknown
          --no-default-features --features wasm,js-engine

  harmony-cross-check:
    name: HarmonyOS (OpenHarmony) cross-compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable with OpenHarmony targets
        uses: dtolnay/rust-toolchain@stable
        with:
          # All OpenHarmony triples rustup ships a prebuilt std for. The fourth
          # (`loongarch64-unknown-linux-ohos`) is Tier 3 — no official builds —
          # and the SDK ships no libc for it either, so it is not installed here;
          # the gate asserts that state instead of assuming it.
          targets: aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos,x86_64-unknown-linux-ohos
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # `cargo ohos` computes the correct cross environment (sysroot, per-target
      # clang, cc-rs/bindgen/pkg-config flags, `-D__MUSL__`). Driving it instead of
      # hand-setting only the linker is what makes C dependencies compile against
      # the OpenHarmony sysroot rather than the host's headers.
      - name: Install cargo-ohos
        run: cargo install cargo-ohos --locked
      # The OpenHarmony native toolchain (clang + sysroot) ships inside the OHOS
      # SDK, which is not on crates.io. Without it the cross build fails at link
      # time with "file in wrong format" / "Relocations in generic ELF (EM: 183)":
      # the host `ld` cannot read OpenHarmony objects. `actions/setup-*` has no
      # OpenHarmony action, so the SDK is fetched from the upstream mirror that
      # also serves Ubuntu hosts.
      #
      # The archive is a bundle of *nested* per-component zips
      # (`ohos-sdk/linux/{ets,js,native,previewer,toolchains}-linux-x64-*.zip`),
      # so unpacking it alone yields zips, not headers and binaries. Only
      # `native` is needed here; it expands to `native/{llvm,sysroot,build,...}`.
      # URL and checksum verified against the mirror (HTTP 200, sha256 matches).
      - name: Install OpenHarmony SDK (native toolchain)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ohos-sdk.tar.gz "$OHOS_SDK_URL"
          echo "$OHOS_SDK_SHA256  /tmp/ohos-sdk.tar.gz" | sha256sum -c -

          mkdir -p /tmp/ohos-bundle "$HOME/ohos-sdk"
          tar -xzf /tmp/ohos-sdk.tar.gz -C /tmp/ohos-bundle
          component="$(find /tmp/ohos-bundle -name 'native-*-x64-*.zip' -print -quit)"
          test -n "$component" || { echo "no native component zip in the bundle"; exit 1; }

          unzip -q "$component" -d "$HOME/ohos-sdk/linux"
          test -x "$HOME/ohos-sdk/linux/native/llvm/bin/aarch64-unknown-linux-ohos-clang" \
            || { echo "native component did not unpack to native/llvm/bin"; exit 1; }
          echo "OHOS_SDK=$HOME/ohos-sdk/linux" >> "$GITHUB_ENV"
        env:
          OHOS_SDK_URL: https://repo.huaweicloud.com/harmonyos/os/6.0-Beta1/ohos-sdk-windows_linux-public.tar.gz
          OHOS_SDK_SHA256: 26f8e0a57a391927bf6d7f484047895c724055b4c1f9c97ad87b5d51fb55b4cd
      - name: Configure OpenHarmony linker
        shell: bash
        run: |
          # `cargo ohos` reads OHOS_SDK_NATIVE and points it at the SDK's `native`
          # directory. The gate derives it from OHOS_SDK too, so either works.
          echo "OHOS_SDK_NATIVE=$OHOS_SDK/native" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=$OHOS_SDK/native/llvm/bin/aarch64-unknown-linux-ohos-clang" >> "$GITHUB_ENV"
      # The checks themselves live in the gate script so CI and a workstation run
      # byte-identical commands. It also re-asserts the target-identification
      # premise they rest on (`target_os="linux"`, `target_env="ohos"`): the
      # backend arms in `src/platform/runtime.rs` key off `target_env`, and a
      # silent change there would flip every one of them.
      - name: HarmonyOS cross-target gate
        shell: bash
        run: bash tools/check_harmony_cross.sh

  android-cross-check:
    name: Android NDK cross-compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: false
      - name: Set ANDROID_NDK_HOME and link toolchain
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          HOST_TAG="linux-x86_64"
          TOOLCHAIN_DIR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$HOST_TAG"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN_DIR/bin" >> $GITHUB_ENV
          # Point cargo at the NDK linker/compilers for every shipped ABI. Without
          # these, cc-rs and the linker step fall back to host tools and the
          # build fails or silently links host objects.
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN_DIR/bin/aarch64-linux-android21-clang"
            echo "CC_aarch64_linux_android=$TOOLCHAIN_DIR/bin/aarch64-linux-android21-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN_DIR/bin/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN_DIR/bin/x86_64-linux-android21-clang"
            echo "CC_x86_64_linux_android=$TOOLCHAIN_DIR/bin/x86_64-linux-android21-clang"
            echo "AR_x86_64_linux_android=$TOOLCHAIN_DIR/bin/llvm-ar"
          } >> $GITHUB_ENV
      # This gate is what caught the `mobile`/`tablet`/`desktop` profiles failing
      # to cross-compile: `image`'s AVIF codec used to pull in the system
      # `dav1d-sys`, which needs a pkg-config sysroot on non-host targets. Keep
      # the check honest -- no `|| echo skipped` -- so a regression fails CI.
      - name: Cargo check (Android ABIs x profiles)
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-linux-android x86_64-linux-android; do
            for profile in mini embedded mobile tablet desktop; do
              echo "::group::cargo check --target $target --no-default-features --features $profile"
              cargo check --target "$target" --no-default-features --features "$profile"
              echo "::endgroup::"
            done
          done

  # The Windows backend is a large cfg(target_os = "windows") surface that a Linux
  # dev host cannot run. Cross-checking it here keeps that code compiling and
  # warning-free even though runtime verification still needs a Windows machine.
  windows-cross-check:
    name: Windows backend cross-compile check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (windows backend, full desktop surface)
        run: |
          cargo check --target x86_64-pc-windows-msvc --no-default-features \
            --features "windows desktop-runtime wgpu touch i18n controls-native controls-custom serde serde_json advanced-widgets quality-management"

      - name: Cargo clippy (windows backend, deny warnings)
        run: |
          cargo clippy --target x86_64-pc-windows-msvc --no-default-features \
            --features "windows desktop-runtime wgpu touch i18n controls-native controls-custom serde serde_json advanced-widgets quality-management" \
            -- -D warnings

  wayland-compositor:
    name: Wayland backend against a real compositor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # weston provides a headless compositor; dav1d is the system dependency of
      # the `image` feature pulled in by `wayland-native`'s test feature set.
      # Both are available as distro packages on the runner, so the rootless
      # download-and-patch fallback used on developer machines is not needed.
      - name: Install weston + dav1d
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq weston libdav1d-dev
          weston --version

      - name: Verify Wayland backend against a live compositor
        shell: bash
        run: |
          chmod +x tools/run_wayland_compositor_tests.sh
          # In auto mode the script prefers the system weston installed above.
          WESTON_MODE=system ./tools/run_wayland_compositor_tests.sh

  # ── Apple native verification (macOS host) ──
  # The developer/macOS host is the only place where AppKit and UIKit can be
  # exercised for real. GitHub's `macos-14`/`macos-latest` runners are Apple
  # Silicon, so both the main-thread AppKit probe and the iOS Simulator probe
  # run here — closing blue14 §二 A 类 #4/#5 continuously rather than once.
  apple-native:
    name: Apple native (AppKit + iOS Simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # macOS AppKit verification. The two `apple_appkit_probe*` examples used to
      # run here; they asserted the native *control* path (a live `NSButton` moving
      # with `set_widget_geometry`), which the self-drawn architecture removed
      # (BLUE15 #55/#56). They are deleted, so their steps are gone too rather than
      # left to fail. The surviving static gate and the macOS lib tests below cover
      # the host surface that does still exist.
      - name: Apple native static gate (FFI thread-safety + selector guards)
        run: bash tools/check_apple_thread_safety.sh

      # 2. macOS-lib regression with both Apple backends selected.
      - name: Cargo test (macos backend)
        run: cargo test --lib --features macos

      - name: Cargo test (cocoa-legacy backend)
        run: cargo test --lib --features desktop

      # 3. iOS Simulator: build a real .app and run it on a booted simulator,
      #    asserting the UIKit FFI produced live UIView objects.
      - name: Boot iOS Simulator
        run: |
          RUNTIME="$(xcrun simctl list runtimes | awk '/^iOS/ {print $NF}' | tail -1)"
          DEVICE_ID="$(xcrun simctl create rw-ios-probe "iPhone 16" "$RUNTIME")"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "RW_IOS_UDID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build iOS Simulator test app
        run: bash tools/build_ios_testapp.sh

      - name: iOS Simulator probe
        run: |
          SKIP_BUILD=1 IOS_SIM_DEVICE="$(xcrun simctl list devices | sed -nE 's/^[[:space:]]*(iPhone[^(]*) \([0-9A-F-]+\).*/\1/p' | head -1)" \
            bash tools/run_ios_testapp.sh

      - name: iOS device-target compile check
        run: cargo check --target aarch64-apple-ios --features "desktop,ios-uikit-ffi"
