name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast, emulator-free gate: build the native library for both shipped ABIs,
  # assemble + sign an APK for each, and verify the JNI binding surface matches
  # the Java declarations and the built .so export tables.
  jni-bindings:
    name: JNI bindings + APK build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build + sign test APK
        shell: bash
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_JAR_LEVEL: '34'
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          chmod +x tools/build_android_testapp.sh
          ./tools/build_android_testapp.sh

      - name: Verify JNI signatures (declarations vs Rust exports + built .so)
        shell: bash
        run: |
          chmod +x tools/check_jni_signatures.sh
          ./tools/check_jni_signatures.sh

      - name: Upload JNI binding audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jni-binding-map-${{ matrix.abi }}
          path: target/qa/jni_*_map*.json
          retention-days: 7

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-testapp-${{ matrix.abi }}
          path: target/android-testapp-${{ matrix.abi }}/app-signed.apk
          retention-days: 7

  # Full end-to-end run on a real emulator. The runner provides /dev/kvm, so the
  # x86_64 system image boots with hardware acceleration. This is the same
  # script a developer runs locally, so CI and local verification cannot drift.
  emulator-e2e:
    name: Emulator end-to-end (x86_64)
    runs-on: ubuntu-latest
    needs: jni-bindings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with x86_64 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot AVD system image
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "system-images;android-34;google_apis;x86_64"

      - name: Run emulator end-to-end test
        shell: bash
        env:
          ANDROID_ABI: x86_64
          ANDROID_JAR_LEVEL: '34'
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          chmod +x tools/run_android_testapp.sh
          ./tools/run_android_testapp.sh

      - name: Dump logcat on failure
        if: failure()
        run: |
          "$ANDROID_SDK_ROOT/platform-tools/adb" logcat -d 2>/dev/null | tail -200 || true
