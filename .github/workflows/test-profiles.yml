name: Test profiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-other-profiles:
    name: Test profiles (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [tablet, mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo test (${{ matrix.profile }})
        run: cargo test --no-default-features --features "${{ matrix.profile }}" -q
