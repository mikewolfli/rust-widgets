name: Benchmarks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # One runner: `benches/run_benchmarks.sh` executes all nine registered benchmarks.
      # A separate `cargo bench` step here used to run event/layout/signal a second time, and the
      # step name said "all 5" while the script ran nine (N2-04).
      - name: Run benchmark script (all 9 benches)
        run: bash benches/run_benchmarks.sh

      - name: Upload benchmark summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-summary
          path: target/benchmark_summary.txt
