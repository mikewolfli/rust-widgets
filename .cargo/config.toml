# The device profiles are mutually exclusive: `--all-features` turns `desktop`
# and `mini` on together, and `mini` switches the crate to `no_std`, so that
# combination cannot compile (principle #47/#48, and the same rule CONTRIBUTING.md
# and CI enforce). These aliases therefore pin the desktop profile explicitly,
# matching the contributor workflow and the CI `quality-gates` job.
[alias]
check-all = "check --all-targets --no-default-features --features desktop"
test-all = "test --no-default-features --features desktop -q"
lint = "clippy --all-targets --no-default-features --features desktop -- -D warnings"
fmt-check = "fmt --all -- --check"

# System dependencies installation helpers
#
# Cargo aliases are argument lists, not shell commands: `;`, redirection and quoting
# are passed through as literal arguments, so an alias cannot run a script. The
# platform installers are plain scripts and must be invoked directly:
#
#   bash scripts/install-deps-linux.sh
#   bash scripts/install-deps-macos.sh
#
# (The former `install-deps` alias wrapped those scripts in a shell one-liner and
# therefore always failed.)

# MIRI configuration for unsafe code audit (BLUE11 R3.9)
[target.'cfg(miri)']
runner = "cargo miri run"

# Run wasm32-wasip1 test binaries with wasmtime (full std: FS, clock, etc.).
# `--dir=...` maps the repo so file-based tests (capability matrix, etc.) work.
# Install wasmtime with:  curl ... https://github.com/bytecodealliance/wasmtime/releases
# Note: wasm32-unknown-unknown (browser wasm) has no runner-based libtest
# support — use wasip1 for actually executing the test suite.
[target.wasm32-wasip1]
runner = "wasmtime --dir=."

# The -threads variant enables the wasi threads proposal (spawn, atomics).
[target.wasm32-wasip1-threads]
runner = "wasmtime --wasm threads=y --dir=."

[env]
# Enable runtime tracing for MIRI validation
RUST_WIDGETS_TRACE_RUNTIME = { value = "1", target = "miri" }

# Suppress future-incompat report for block 0.1.6 (transitive dep of cocoa 0.24)
[future-incompat-report]
frequency = "never"
