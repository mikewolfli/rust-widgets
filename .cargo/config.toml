[alias]
check-all = "check --all-features"
test-all = "test --all-features -q"
lint = "clippy --all-features --all-targets -- -D warnings"
fmt-check = "fmt --all -- --check"

# System dependencies installation helpers
install-deps = "run -p rust_widgets -- build.rs --help 2>/dev/null; echo 'See scripts/ for platform-specific install scripts'"

# MIRI configuration for unsafe code audit (BLUE11 R3.9)
[target.'cfg(miri)']
runner = "cargo miri run"

[env]
# Enable runtime tracing for MIRI validation
RUST_WIDGETS_TRACE_RUNTIME = { value = "1", target = "miri" }

# Suppress future-incompat report for block 0.1.6 (transitive dep of cocoa 0.24)
[future-incompat-report]
frequency = "never"
