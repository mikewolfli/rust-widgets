[book]
title = "Rust Widgets Documentation"
authors = ["Rust Widgets Team"]
description = "Comprehensive documentation for the rust_widgets GUI framework"
language = "en"
multilingual = true

[build]
build-dir = "book"
create-missing = false

[preprocessor.index]

[preprocessor.links]

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
curly-quotes = true
copy-fonts = true

[output.html.search]
limit-results = 20
teaser-word-count = 30

[output.html.fold]
enable = true
level = 0

[output.html.playground]
editable = false
copyable = true
copy-js = true
line-numbers = true
runnable = false

[output.html.print]
enable = true

[output.html.redirect]
"/introduction.html" = "/index.html"

[output.markdown]

[language.en]
name = "English"
src = "en"

[language.zh-cn]
name = "简体中文"
src = "zh-cn"

[language.zh-tw]
name = "繁體中文"
src = "zh-tw"

[language.fr]
name = "Français"
src = "fr"
