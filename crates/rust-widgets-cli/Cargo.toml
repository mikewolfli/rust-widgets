[package]
name = "rust-widgets-cli"
version = "4.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "`rwui`: the rust_widgets designer CLI — check a project bundle, generate Rust from it, and (in later stages) convert in both directions"
authors = ["Mike Li <mikewolfli@163.com>"]
homepage = "https://github.com/mikewolfli/rust-widgets"
repository = "https://github.com/mikewolfli/rust-widgets"
keywords = ["gui", "widget", "designer", "cli"]
categories = ["gui", "development-tools"]

# A nested package inside the main crate's tree, like `rust-widgets-suites`: the parent's
# `include` excludes `crates/**/*`, so this tool is not part of the parent's published tarball
# (BLUE31 §2.1). A host builds it from the repository.
include = ["/src/**/*"]

[[bin]]
name = "rwui"
path = "src/main.rs"

[dependencies]
# The CLI is a **desktop host tool**: the generator, the loader and the `designer` module only
# exist under the desktop profile (`src/lib.rs`), which is what BLUE31 §2.1 records. It does not
# enable the editor controls: the CLI never constructs a widget.
rust_widgets = { path = "../..", features = ["desktop"] }
serde_json = "1.0"
